source = $HOME/.config/hypr/themes/catppuccin/mocha.conf
source = $HOME/.config/hypr/wallpaper.conf

# $font = Fira Code Retina:font_features=cv11,cv14
$font = Determination
# $font = Fira Code

# GENERAL
general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = false
    text_trim = true
    fail_timeout = 2000
    fractional_scaling = 2
}

# AUTHENTICATIOIN
auth {
    pam:enabled = true
    fingeriprint:enabled = false
}

# ANIMATIONS
animations {

}

# BACKGROUND
background {
    monitor = eDP-1
    path = $wallpaperdir/$wallpaper
    blur_passes = 3
    blur_radius = 10
    # color = $base
}

# LAYOUT
# label {
#   monitor =
#   text = Layout: $LAYOUT
#   color = $text
#   font_size = 25
#   font_family = $font
#   position = 30, -30
#   halign = left
#   valign = top
# }

shape {
    monitor =
    size = 1920, 150
    color = rgba($crustAlpha70)
    halign = center
    valign = top
    position = 0,0
}

shape {
    monitor =
    size = 1920, 150
    color = rgba($crustAlpha70)
    halign = center
    valign = bottom
    position = 0,0
}

shape { # CIRCLE
    monitor = 
    size = 200, 200
    color = rgba($crustAlpha70)
    rounding = -1
    border_size = 3
    border_color = $accent
    halign = center
    valign = center
    position = 0, 0
    zindex = 0
}

# TIME
label {
    monitor =
    text = <span size="small">$TIME</span>
    color = $text
    font_size = 30
    font_family = $font
    position = 0, 5
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:10000] date +"%a %d"
    color = $text
    font_size = 15
    font_family = $font
    halign = center
    valign = center
    position = 0, -26
}

# NAME
label {
    monitor =
    text = $USER
    color = $text
    font_size = 15
    font_family = $font
    halign = center
    valign = center
    position = 0, 39
}

# BATTERY
label {
    monitor = 
    text = cmd[update:10000] echo "$(cat /sys/class/power_supply/BAT0/capacity)%"
    color = $text
    font_size = 15
    font_family = $font
    halign = center
    valign = center
    position = 0, -72
}

label {
    monitor =
    text = Despite everything, it's still you.
    color = $text
    font_size = 13
    font_family = $font
    halign = center
    valign = bottom
    position = 0, 300
}

shape {
    monitor =
    size = 350, 50
    rounding = -1
    color = rgba($crustAlpha70)
    halign = center
    valign = bottom
    position = 0, 289
}

image {
    monitor =
    path = /home/Aurelio/Pictures/doggo.png
    size = 70
    border_size = 0
    rounding = 0
    halign = center
    valign = bottom
    position = 0, 370
}

# INPUT FIELD
input-field {
    monitor =
    size = 150, 50
    outline_thickness = 0
    # dots_text_format = '#'
    dots_size = 0.2
    dots_spacing = 0.25
    dots_center = true
    outer_color = $accent
    inner_color = rgba(00,00,00,00)
    font_color = $text
    fade_on_empty = true
    placeholder_text = <span foreground="##$textAlpha"><i>...</i></span>
    hide_input = false
    check_color = $accent
    fail_color = rgba(00,00,00,00)
    fail_text = <i>Try again... (+$ATTEMPTS)</i>
    fail_text_color = $red
    capslock_color = $yellow
    position = 0, -47
    halign = center
    valign = center
}

